name: deskplan_companion
description: "DeskPlan Companion: Android task queue and file sharing."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.5
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  device_info_plus: ^13.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  android_intent_plus: ^6.1.0
  path_provider: ^2.1.6
  nsd: ^5.0.1
  workmanager: ^0.10.10
  package_info_plus: ^10.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate the launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#121319"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
